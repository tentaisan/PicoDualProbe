# PicoDualProbe — OpenOCD JTAG config
# For debugging RISC-V targets (NEORV32) and other JTAG devices
#
# Usage: openocd -f scripts/openocd/picodualprobe-jtag.cfg -f scripts/openocd/neorv32.cfg

adapter driver cmsis-dap
transport select jtag
adapter speed 1000

# Set PICODUALPROBE_SERIAL to select a specific probe when several are attached.
if {[info exists ::env(PICODUALPROBE_SERIAL)] && $::env(PICODUALPROBE_SERIAL) ne ""} {
    adapter serial $::env(PICODUALPROBE_SERIAL)
}
