# PicoDualProbe — JTAG scan from Pico to NEORV32
# Set PICODUALPROBE_SERIAL when multiple probes are connected.

adapter driver cmsis-dap
transport select jtag
adapter speed 1000
if {[info exists ::env(PICODUALPROBE_SERIAL)] && $::env(PICODUALPROBE_SERIAL) ne ""} {
    adapter serial $::env(PICODUALPROBE_SERIAL)
}

jtag newtap auto0 tap -irlen 5 -expected-id 0x00000000 -ignore-version

init
scan_chain
shutdown